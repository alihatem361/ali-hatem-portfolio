    <!--
      Google Tag Manager — production host only, so localhost, `vite preview`
      and Vercel preview deployments never send hits to the GA4 property.

      Visiting any page with ?internal=1 marks this browser as internal
      (cookie ah_internal=1, one year); ?internal=0 clears it. GTM reads the
      cookie into GA4's traffic_type parameter — see docs/analytics-setup.md.
    -->
    <script>
      (function (w, d, s, l, i) {
        var host = w.location.hostname;
        if (host !== "www.alihatem.me" && host !== "alihatem.me") return;
        try {
          var internal = new URLSearchParams(w.location.search).get("internal");
          if (internal === "1") {
            d.cookie = "ah_internal=1; path=/; max-age=31536000; SameSite=Lax";
          } else if (internal === "0") {
            d.cookie = "ah_internal=; path=/; max-age=0; SameSite=Lax";
          }
        } catch (e) {}
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-W7W2WPMT");
    </script>
    <!-- End Google Tag Manager -->
